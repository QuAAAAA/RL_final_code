[project]
name = "taiwanese-asr"
version = "0.1.0"
description = "Taiwanese ASR fine-tuning with Whisper and RawBoost augmentation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "audiomentations>=0.30",
    "nlpaug>=1.1",
    "tqdm>=4.66",
    "python-Levenshtein>=0.21",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
notebook = [
    "torch>=2.0",
    "transformers>=4.40,<5.0",
    "peft>=0.10",
    "accelerate>=0.28",
    "evaluate>=0.4",
    "jiwer>=3.0",
    "scikit-learn>=1.3",
    "kaggle>=1.6",
    "matplotlib>=3.7",
    "wandb>=0.16",
    "ipykernel>=6.0",
]
