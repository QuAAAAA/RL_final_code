__HPARAM__group_size:
    value: 每個 prompt 取樣幾個候選（GRPO rollout 群大小，越大 variance 估計越準但 VRAM 倍增）
__HPARAM__learning_rate:
    value: AdamW 學習率
__HPARAM__limit:
    value: 訓練樣本數上限，null = 用全部資料
__HPARAM__max_mel_tokens:
    value: 每次取樣最多生成幾個 mel token（限制輸出長度）
__HPARAM__reward_weights:
    value: 各 reward 的加權比重（總 reward = 加權和）
__HPARAM__temperature:
    value: 取樣溫度（越高越多樣，越低越保守）
__HPARAM__top_k:
    value: top-k 取樣（0 = 不限制）
__HPARAM__top_p:
    value: nucleus 取樣（1.0 = 不限制）
__HPARAM__updates:
    value: 整個資料集跑幾輪（epoch 數）
